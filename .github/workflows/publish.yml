name: Publish to PyPI

# Runs when you publish a GitHub Release (not on every push).
# Uses PyPI "trusted publishing", so no API token is stored in the repo.
# One-time setup on pypi.org: Account settings -> Publishing -> add a pending
# publisher for this repo, workflow "publish.yml", environment "pypi".

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
