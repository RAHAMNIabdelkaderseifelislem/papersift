[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "papersift"
version = "0.1.0"
description = "An open-source LLM-powered research assistant for discovering, evaluating, ranking, and organizing academic papers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Abedelkader Seif El Islem Rahmani" },
    { name = "Mohammed Bennour" }
]
keywords = [
    "academic-research",
    "research-assistant",
    "literature-review",
    "systematic-review",
    "arxiv",
    "paper-discovery",
    "paper-ranking",
    "llm",
    "ai-agents",
    "research-automation",
    "ollama",
    "gemini",
    "openai-compatible",
    "scientific-research"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "arxiv>=2.0",
    "requests>=2.31",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gui = ["streamlit>=1.30", "pandas>=2.0"]
fulltext = ["pymupdf>=1.23"]
dev = ["pytest>=7.0"]

[project.scripts]
papersift = "papersift.cli:main"

[project.urls]
Homepage = "https://github.com/RAHAMNIabdelkaderseifelislem/papersift"
Repository = "https://github.com/RAHAMNIabdelkaderseifelislem/papersift"
Issues = "https://github.com/RAHAMNIabdelkaderseifelislem/papersift/issues"
Changelog = "https://github.com/RAHAMNIabdelkaderseifelislem/papersift/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["papersift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
